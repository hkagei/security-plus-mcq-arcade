<html lang="en">
<head>
<meta charset="UTF-8">

<title>Security+ Arcade — SY0-701 Study Game</title>
<style>
  :root {
    --bg: #0B0F14;
    --panel: #12181F;
    --panel-raised: #171F28;
    --border: #232D38;
    --text: #E8ECEF;
    --text-dim: #8B95A1;
    --amber: #FFB627;
    --amber-dim: #7A5E1F;

    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 999;
  }

  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .marquee {
    text-align: center;
    margin-bottom: 40px;
  }

  .marquee h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 4px;
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255,182,39,0.5), 0 0 18px rgba(255,182,39,0.25);
    margin: 0 0 8px;
    animation: powerOn 1.1s ease-out;
  }

  @keyframes powerOn {
    0% { opacity: 0; letter-spacing: 14px; filter: brightness(2.5); }
    60% { opacity: 1; }
    100% { opacity: 1; letter-spacing: 4px; filter: brightness(1); }
  }

  .marquee p {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    letter-spacing: 1px;
  }

  #arcadeFloor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 560px) {
    #arcadeFloor { grid-template-columns: 1fr; }
  }

  .cabinet {
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .cabinet-marquee {
    background: var(--amber);
    color: #1a1200;
    font-family: var(--font-display);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 8px 12px;
    text-align: center;
  }

  .cabinet-screen {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cabinet-screen p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.5;
  }

  .highscore {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--amber-dim);
  }

  button {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    cursor: pointer;
  }

  button:hover:not(:disabled) {
    border-color: var(--amber);
    color: var(--amber);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .play-btn {
    background: var(--amber);
    color: #1a1200;
    border: none;
    margin-top: auto;
  }

  .play-btn:hover:not(:disabled) {
    filter: brightness(1.1);
    color: #1a1200;
  }

  #gameArea {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .lives-pips span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--bad);
    margin-left: 3px;
  }
  .lives-pips span.spent { background: var(--border); }

  .timer-track {
    height: 4px;
    background: var(--border);
    margin-bottom: 20px;
  }

  .timer-fill {
    height: 100%;
    background: var(--amber);
    transition: width 0.1s linear;
  }

  #qPrompt {
    font-size: 17px;
    margin: 0 0 18px;
    line-height: 1.4;
  }

  #qOptions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  #qOptions button {
    text-align: left;
  }

  .correct-opt {
    border-color: var(--good) !important;
    color: var(--good) !important;
  }
  .wrong-opt {
    border-color: var(--bad) !important;
    color: var(--bad) !important;
  }

  #feedback {
    font-size: 14px;
    min-height: 20px;
  }
  #feedback .good { color: var(--good); font-weight: 700; }
  #feedback .bad { color: var(--bad); font-weight: 700; }

  .domain-pick {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #endScreen {
    text-align: center;
  }

  #endScreen h2 {
    font-family: var(--font-display);
    color: var(--amber);
    letter-spacing: 1px;
  }

  .end-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .hidden { display: none !important; }

  .back-row {
    margin-bottom: 14px;
  }
</style>
</head>

/* =========================================================
   UTILITIES
   ========================================================= */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getHighScore(key) {
  return parseInt(localStorage.getItem(key) || "0", 10);
}

function setHighScoreIfBetter(key, value) {
  const current = getHighScore(key);
  if (value > current) {
    localStorage.setItem(key, String(value));
    return true;
  }
  return false;
}

function buildAcronymQuestion(item) {
  const pool = ACRONYM_BANK.filter(x => x.a !== item.a);
  const distractors = shuffle(pool).slice(0, 3).map(x => x.d);
  const opts = shuffle([item.d, ...distractors]);
  const c = opts.indexOf(item.d);
  return { p: "What does " + item.a + " stand for?", opts, c };
}

    title: "ACRONYM BLITZ",

    highScoreKey: "sp_arcade_hs_acronym"
  }
];

function renderArcadeFloor() {
  const floor = document.getElementById("arcadeFloor");
  floor.innerHTML = "";
  CABINETS.forEach(cab => {
    const card = document.createElement("div");
    card.className = "cabinet";

    const marquee = document.createElement("div");
    marquee.className = "cabinet-marquee";
    marquee.textContent = cab.title;
    card.appendChild(marquee);

    const screen = document.createElement("div");
    screen.className = "cabinet-screen";

    const desc = document.createElement("p");
    desc.textContent = cab.desc;
    screen.appendChild(desc);

    if (cab.highScoreKey) {
      const hs = document.createElement("p");
      hs.className = "highscore";
      hs.textContent = "HIGH SCORE: " + getHighScore(cab.highScoreKey);
      screen.appendChild(hs);
    }

    const playBtn = document.createElement("button");
    playBtn.className = "play-btn";
    playBtn.textContent = "Insert coin ▸ Play";
    playBtn.addEventListener("click", () => enterCabinet(cab.id));
    screen.appendChild(playBtn);

    card.appendChild(screen);
    floor.appendChild(card);
  });
}

function enterCabinet(id) {
  document.getElementById("arcadeFloor").classList.add("hidden");
  document.getElementById("gameArea").classList.remove("hidden");
  document.getElementById("domainPickScreen").classList.add("hidden");
  document.getElementById("playScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");

  if (id === "speed") {
    beginRound({
      mode: "speed",
      queueMode: "fixed",
      queue: shuffle(QUESTION_BANK).slice(0, 15),
      timerSeconds: 15,
      livesLimit: 3,
      isAcronym: false,
      highScoreKey: "sp_arcade_hs_speed",
      hudLabel: "SPEED ROUND"
    });
  } else if (id === "survival") {
    beginRound({
      mode: "survival",
      queueMode: "endless",
      pool: QUESTION_BANK,
      bag: shuffle(QUESTION_BANK),
      baseTimer: 15,
      minTimer: 8,
      decreasing: true,
      livesLimit: 3,
      isAcronym: false,
      highScoreKey: "sp_arcade_hs_survival",
      hudLabel: "SURVIVAL MODE"
    });
  } else if (id === "acronym") {
    beginRound({
      mode: "acronym",
      queueMode: "fixed",
      queue: shuffle(ACRONYM_BANK).slice(0, 12),
      timerSeconds: 12,
      livesLimit: 3,
      isAcronym: true,
      highScoreKey: "sp_arcade_hs_acronym",
      hudLabel: "ACRONYM BLITZ"
    });
  } else if (id === "domain") {
    showDomainPicker();
  }
}

function showDomainPicker() {
  document.getElementById("domainPickScreen").classList.remove("hidden");
  const domains = [...new Set(QUESTION_BANK.map(q => q.domain))];
  const box = document.getElementById("domainButtons");
  box.innerHTML = "";
  domains.forEach(dom => {
    const btn = document.createElement("button");
    btn.textContent = dom;
    btn.addEventListener("click", () => {
      document.getElementById("domainPickScreen").classList.add("hidden");
      const pool = QUESTION_BANK.filter(q => q.domain === dom);
      beginRound({
        mode: "domain",
        queueMode: "fixed",
        queue: shuffle(pool).slice(0, 10),
        timerSeconds: 20,
        livesLimit: null,
        isAcronym: false,
        highScoreKey: "sp_arcade_hs_domain_" + dom.replace(/\s+/g, "_"),
        hudLabel: dom.toUpperCase() + " PRACTICE"
      });
    });
    box.appendChild(btn);
  });
}

document.getElementById("backToFloorBtn").addEventListener("click", () => {
  clearInterval(game && game.timerId);
  document.getElementById("gameArea").classList.add("hidden");
  document.getElementById("arcadeFloor").classList.remove("hidden");
  renderArcadeFloor();
});

/* =========================================================
   GAME ENGINE
   ========================================================= */

let game = null;

function beginRound(cfg) {
  game = {
    cfg,
    idx: 0,
    score: 0,
    streak: 0,
    correctCount: 0,
    lives: cfg.livesLimit === null ? Infinity : cfg.livesLimit,
    timerId: null,
    remaining: 0
  };
  document.getElementById("playScreen").classList.remove("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  nextQuestion();
}

function getNextRawQuestion() {
  const cfg = game.cfg;
  if (cfg.queueMode === "fixed") {
    if (game.idx >= cfg.queue.length) return null;
    return cfg.queue[game.idx];
  } else {
    if (cfg.bag.length === 0) cfg.bag = shuffle(cfg.pool);
    return cfg.bag.pop();
  }
}

function currentTimerSeconds() {
  const cfg = game.cfg;
  if (cfg.decreasing) {
    const reduction = Math.floor(game.correctCount / 5);
    return Math.max(cfg.minTimer, cfg.baseTimer - reduction);
  }
  return cfg.timerSeconds;
}

function nextQuestion() {
  const raw = getNextRawQuestion();
  if (!raw) return endRound(true);

  const q = game.cfg.isAcronym ? buildAcronymQuestion(raw) : raw;
  game.currentQ = q;

  const totalLabel = game.cfg.queueMode === "fixed"
    ? "Q " + (game.idx + 1) + " / " + game.cfg.queue.length
    : "Q " + (game.idx + 1) + " (survival)";
  document.getElementById("hudLeft").textContent = totalLabel;
  document.getElementById("hudScore").textContent = "SCORE " + game.score;
  renderLives();

  document.getElementById("qPrompt").textContent = q.p;
  const optBox = document.getElementById("qOptions");
  optBox.innerHTML = "";
  q.opts.forEach((opt, oi) => {
    const b = document.createElement("button");
    b.textContent = opt;
    b.addEventListener("click", () => answer(oi));
    optBox.appendChild(b);
  });
  document.getElementById("feedback").innerHTML = "";

  game.remaining = currentTimerSeconds();
  document.getElementById("timerFill").style.width = "100%";
  clearInterval(game.timerId);
  const totalTime = game.remaining;
  game.timerId = setInterval(() => {
    game.remaining -= 0.1;
    const pct = Math.max(0, (game.remaining / totalTime) * 100);
    document.getElementById("timerFill").style.width = pct + "%";
    if (game.remaining <= 0) {
      clearInterval(game.timerId);
      answer(-1);
    }
  }, 100);
}

function renderLives() {
  const el = document.getElementById("hudLives");
  if (game.lives === Infinity) { el.innerHTML = ""; return; }
  el.innerHTML = "";
  for (let i = 0; i < game.cfg.livesLimit; i++) {
    const pip = document.createElement("span");
    if (i >= game.lives) pip.className = "spent";
    el.appendChild(pip);
  }
}

function answer(picked) {
  clearInterval(game.timerId);
  const q = game.currentQ;
  const optBox = document.getElementById("qOptions");
  const buttons = optBox.querySelectorAll("button");
  buttons.forEach((b, bi) => {
    b.disabled = true;
    if (bi === q.c) b.classList.add("correct-opt");
    else if (bi === picked) b.classList.add("wrong-opt");
  });

  const correct = picked === q.c;
  const fb = document.getElementById("feedback");
  if (correct) {
    game.streak += 1;
    game.correctCount += 1;
    const bonus = (game.streak - 1) * 2;
    game.score += 10 + bonus;
    fb.innerHTML = '<span class="good">Correct.</span> +' + (10 + bonus) + ' points' + (game.streak > 1 ? ' (streak x' + game.streak + ')' : '') + '.';
  } else {
    game.streak = 0;
    if (game.lives !== Infinity) game.lives -= 1;
    fb.innerHTML = picked === -1 ? '<span class="bad">Time is up.</span>' : '<span class="bad">Not quite.</span>';
  }

  document.getElementById("hudScore").textContent = "SCORE " + game.score;
  renderLives();
  game.idx += 1;

  setTimeout(() => {
    if (game.lives !== Infinity && game.lives <= 0) {
      endRound(false);
    } else {
      nextQuestion();
    }
  }, 1200);
}

function endRound(cleared) {
  document.getElementById("playScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.remove("hidden");
  document.getElementById("endTitle").textContent = cleared ? "ROUND CLEARED" : "GAME OVER";

  let detail = "Final score: " + game.score;
  if (game.cfg.mode === "domain") {
    detail = "Correct: " + game.correctCount + " / " + game.cfg.queue.length;
  } else if (game.cfg.queueMode === "endless") {
    detail = "Survived " + game.idx + " question" + (game.idx === 1 ? "" : "s") + " — final score: " + game.score;
  }
  document.getElementById("endDetail").textContent = detail;

  const hsEl = document.getElementById("endHighScore");
  if (game.cfg.highScoreKey) {
    const metric = game.cfg.mode === "domain" ? game.correctCount : game.score;
    const isNew = setHighScoreIfBetter(game.cfg.highScoreKey, metric);
    hsEl.textContent = isNew ? "NEW HIGH SCORE!" : "High score: " + getHighScore(game.cfg.highScoreKey);
  } else {
    hsEl.textContent = "";
  }
}

document.getElementById("playAgainBtn").addEventListener("click", () => {
  const modeId = game.cfg.mode === "domain" ? "domain" : game.cfg.mode;
  document.getElementById("endScreen").classList.add("hidden");
  if (modeId === "domain") {
    showDomainPicker();
  } else {
    enterCabinet(modeId);
  }
});

document.getElementById("endBackBtn").addEventListener("click", () => {
  document.getElementById("gameArea").classList.add("hidden");
  document.getElementById("arcadeFloor").classList.remove("hidden");
  renderArcadeFloor();
});

/* =========================================================
   INIT
   ========================================================= */
renderArcadeFloor();
</script>
